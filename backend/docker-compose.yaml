x-common-healthcheck: &common-healthcheck
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 90s

x-common-service: &common-service
  networks:
    ecommerce-net:
  restart: unless-stopped
  stdin_open: true
  tty: true

x-database-healthcheck: &database-healthcheck
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 60s

services:
  discovery:
    image: abdelaziz333/ecommerce-discovery:0.0.1
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: discovery
        APP_PORT: ${DISCOVERY_PORT}
    ports:
      - "${DISCOVERY_PORT}:${DISCOVERY_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PORT: ${DISCOVERY_PORT}
    <<: *common-service
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:${DISCOVERY_PORT}/actuator/health" ]
      <<: *common-healthcheck
    profiles:
      - app
      - all

  gateway:
    image: abdelaziz333/ecommerce-gateway:0.0.1
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: gateway
        APP_PORT: ${GATEWAY_PORT}
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_PORT: ${GATEWAY_PORT}
      POSTGRES_DB: auth
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
    <<: *common-service
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:${GATEWAY_PORT}/actuator/health" ]
      <<: *common-healthcheck
    profiles:
      - app
      - all
    depends_on:
      discovery:
        condition: service_healthy

  product:
    image: abdelaziz333/ecommerce-product:0.0.1
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: product
        APP_PORT: ${PRODUCT_PORT}
    ports:
      - "${PRODUCT_PORT}:${PRODUCT_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_PORT: ${PRODUCT_PORT}
      POSTGRES_DB: product
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    <<: *common-service
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:${PRODUCT_PORT}/actuator/health" ]
      <<: *common-healthcheck
    profiles:
      - app
      - all
    depends_on:
      discovery:
        condition: service_healthy
      gateway:
        condition: service_healthy

  order:
    image: abdelaziz333/ecommerce-order:0.0.1
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: order
        APP_PORT: ${ORDER_PORT}
    ports:
      - "${ORDER_PORT}:${ORDER_PORT}"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_PORT: ${ORDER_PORT}
      POSTGRES_DB: orders
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    <<: *common-service
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:${ORDER_PORT}/actuator/health" ]
      <<: *common-healthcheck
    profiles:
      - app
      - all
    depends_on:
      discovery:
        condition: service_healthy
      gateway:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    <<: *common-service
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      <<: *database-healthcheck
    profiles:
      - database
      - all

  redis:
    image: redis:8.6.2-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    command:
      - sh
      - -c
      - exec redis-server --requirepass "${REDIS_PASSWORD}" --appendonly yes
    <<: *common-service
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning PING | grep -q PONG"]
      <<: *database-healthcheck
    profiles:
      - database
      - all

volumes:
  postgres_data:
  redis_data:

networks:
  ecommerce-net:
    external: true