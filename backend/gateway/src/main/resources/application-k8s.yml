spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: product-service
              uri: http://product-service:8082
              predicates:
                - Path=/api/v1/products/**

            - id: cart-service
              uri: http://order-service:8083
              predicates:
                - Path=/api/v1/carts/**

            - id: order-service
              uri: http://order-service:8083
              predicates:
                - Path=/api/v1/orders/**

            - id: order-items-service
              uri: http://order-service:8083
              predicates:
                - Path=/api/v1/order-items/**

eureka:
  client:
    enabled: false

jwt:
  secret: ${JWT_SECRET}
  access-token:
    secured: false
  refresh-token:
    secured: false

session:
  secure: false