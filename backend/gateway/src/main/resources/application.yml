spring:
  application:
    name: gateway
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: true

management:
  tracing:
    sampling:
      probability: 1.0
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: health, info, metrics

logging:
  level:
    root: INFO
    com.aziz.gateway: DEBUG
  pattern:
    console: "%d{HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

server:
  port: ${APP_PORT:8081}

jwt:
  secret: ${JWT_SECRET} # required, at least 32 chars
  access-token:
    cookie-name: access_token
    ttl: 15m
    secured: true
  refresh-token:
    cookie-name: refresh_token
    ttl: 15d
    secured: true

session:
  cookie: sessionId
  max-age: 90d
  secure: true
