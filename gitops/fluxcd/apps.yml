apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ecommerce-backend
  namespace: flux-system
spec:
  interval: 5m0s
  path: "./gitops/k8s"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: ecommerce-platform
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age